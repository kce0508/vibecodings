<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO App</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --border: #dbe3f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 30%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .shell {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }

    .hero {
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1.05;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(219, 227, 240, 0.85);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(10px);
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: rgba(37, 99, 235, 0.6);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }

    .title {
      flex: 1;
      word-break: break-word;
      font-size: 16px;
    }

    .title.done {
      color: var(--muted);
      text-decoration: line-through;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .secondary {
      background: #475569;
    }

    .secondary:hover {
      background: #334155;
    }

    .danger {
      background: var(--danger);
    }

    .danger:hover {
      background: #b91c1c;
    }

    .empty {
      padding: 22px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.8);
    }

    .footer {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .row,
      .item {
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="eyebrow">FastAPI + HTML + Fetch API</span>
      <h1>Simple TODO App</h1>
      <p class="sub">
        브라우저에서 바로 TODO를 추가, 완료, 삭제할 수 있는 아주 간단한 프론트엔드입니다.
        데이터는 서버 메모리에 저장됩니다.
      </p>
    </section>

    <section class="card">
      <div class="row">
        <input id="todoInput" type="text" placeholder="할 일을 입력하세요" />
        <button id="addButton" type="button">추가</button>
      </div>

      <ul id="todoList" class="list"></ul>

      <div class="footer">
        새로고침 전까지는 현재 서버 메모리에 있는 TODO를 보여줍니다.
      </div>
    </section>
  </main>

  <script>
    const todoInput = document.getElementById('todoInput');
    const todoList = document.getElementById('todoList');
    const addButton = document.getElementById('addButton');

    async function loadTodos() {
      const response = await fetch('/todos');
      const todos = await response.json();

      todoList.innerHTML = '';

      if (todos.length === 0) {
        todoList.innerHTML = '<li class="empty">아직 TODO가 없습니다. 첫 번째 할 일을 추가해 보세요.</li>';
        return;
      }

      todos.forEach((todo) => {
        const li = document.createElement('li');
        li.className = 'item';

        const title = document.createElement('span');
        title.className = `title${todo.completed ? ' done' : ''}`;
        title.textContent = todo.title;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const toggleButton = document.createElement('button');
        toggleButton.type = 'button';
        toggleButton.className = 'secondary';
        toggleButton.textContent = todo.completed ? '미완료' : '완료';
        toggleButton.addEventListener('click', async () => {
          await fetch(`/todos/${todo.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed: !todo.completed })
          });
          loadTodos();
        });

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'danger';
        deleteButton.textContent = '삭제';
        deleteButton.addEventListener('click', async () => {
          await fetch(`/todos/${todo.id}`, { method: 'DELETE' });
          loadTodos();
        });

        actions.appendChild(toggleButton);
        actions.appendChild(deleteButton);
        li.appendChild(title);
        li.appendChild(actions);
        todoList.appendChild(li);
      });
    }

    async function addTodo() {
      const title = todoInput.value.trim();
      if (!title) {
        alert('할 일을 입력해 주세요.');
        return;
      }

      await fetch('/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      todoInput.value = '';
      todoInput.focus();
      loadTodos();
    }

    addButton.addEventListener('click', addTodo);
    todoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addTodo();
      }
    });

    loadTodos();
  </script>
</body>
</html>

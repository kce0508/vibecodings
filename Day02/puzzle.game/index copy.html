<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단한 퍼즐 게임</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #2d2d35;
      --muted: #8a8a97;
      --accent: #2f6df6;
      --accent-dark: #2458c7;
      --tile: #baf2cc;
      --tile-border: #a8e7ba;
      --tile-shadow: rgba(80, 140, 110, 0.18);
      --success: #1f7a4d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(47, 109, 246, 0.08), transparent 30%),
        linear-gradient(180deg, #fafafd 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: 0 18px 48px rgba(31, 41, 55, 0.12);
      backdrop-filter: blur(10px);
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 14px;
      font-size: 15px;
      font-weight: 700;
    }

    .tries {
      color: #333;
    }

    .restart {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(47, 109, 246, 0.22);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .restart:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border: 1px solid var(--tile-border);
      border-radius: 16px;
      background: linear-gradient(180deg, #ccf7d9 0%, var(--tile) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 4px 12px var(--tile-shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .tile::after {
      content: '?';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .tile.revealed::after,
    .tile.matched::after {
      opacity: 0;
    }

    .tile.revealed {
      transform: scale(1.03);
      box-shadow: 0 8px 18px rgba(64, 164, 103, 0.25);
    }

    .tile.matched {
      cursor: default;
      filter: saturate(1.05);
      box-shadow: 0 8px 18px rgba(31, 122, 77, 0.22);
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--success);
    }

    .status.neutral {
      color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .app {
        padding: 22px 16px 18px;
        border-radius: 22px;
      }

      h1 {
        font-size: 26px;
      }

      .tile {
        font-size: 26px;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>간단한 퍼즐 게임</h1>
      <p class="subtitle">같은 그림 2개를 찾아 모두 맞추면 클리어입니다.</p>
    </header>

    <section class="topbar" aria-label="게임 상태">
      <div class="tries">시도 횟수: <span id="triesCount">0</span></div>
      <button id="restartButton" class="restart" type="button">다시 시작</button>
    </section>

    <section id="board" class="board" aria-label="퍼즐 보드"></section>
    <div id="status" class="status neutral">카드를 눌러 같은 그림을 찾아보세요.</div>
  </main>

  <script>
    const symbols = ['🍇', '🍓', '🥝', '🍎', '🍉', '🍊', '🍒', '🍌'];
    const boardEl = document.getElementById('board');
    const triesEl = document.getElementById('triesCount');
    const statusEl = document.getElementById('status');
    const restartButton = document.getElementById('restartButton');

    let cards = [];
    let firstPick = null;
    let secondPick = null;
    let lockBoard = false;
    let tries = 0;
    let matchedCount = 0;

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function setStatus(message, neutral = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('neutral', neutral);
    }

    function renderBoard() {
      boardEl.innerHTML = '';

      cards.forEach((card) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'tile';
        button.setAttribute('aria-label', '카드');
        button.textContent = card.revealed || card.matched ? card.symbol : '';

        if (card.revealed) {
          button.classList.add('revealed');
        }

        if (card.matched) {
          button.classList.add('matched');
          button.disabled = true;
        }

        button.addEventListener('click', () => handleCardClick(card.id));
        boardEl.appendChild(button);
      });
    }

    function createCards() {
      const deck = shuffle([...symbols, ...symbols]);
      cards = deck.map((symbol, index) => ({
        id: index,
        symbol,
        revealed: false,
        matched: false
      }));
    }

    function resetGame() {
      createCards();
      firstPick = null;
      secondPick = null;
      lockBoard = false;
      tries = 0;
      matchedCount = 0;
      triesEl.textContent = String(tries);
      setStatus('카드를 눌러 같은 그림을 찾아보세요.', true);
      renderBoard();
    }

    function handleCardClick(cardId) {
      if (lockBoard) return;

      const card = cards.find((item) => item.id === cardId);
      if (!card || card.revealed || card.matched) return;

      card.revealed = true;

      if (!firstPick) {
        firstPick = card;
        renderBoard();
        return;
      }

      secondPick = card;
      tries += 1;
      triesEl.textContent = String(tries);
      renderBoard();

      const isMatch = firstPick.symbol === secondPick.symbol;

      if (isMatch) {
        firstPick.matched = true;
        secondPick.matched = true;
        matchedCount += 2;
        firstPick = null;
        secondPick = null;

        if (matchedCount === cards.length) {
          setTimeout(() => {
            setStatus(`축하합니다! ${tries}번 만에 모두 맞췄습니다.`);
          }, 150);
        } else {
          setStatus('맞췄어요!', false);
          setTimeout(() => setStatus('계속 진행해 보세요.', true), 700);
        }

        setTimeout(renderBoard, 180);
        return;
      }

      lockBoard = true;
      setStatus('다시 한 번 시도해 보세요.', true);

      setTimeout(() => {
        firstPick.revealed = false;
        secondPick.revealed = false;
        firstPick = null;
        secondPick = null;
        lockBoard = false;
        renderBoard();
      }, 700);
    }

    restartButton.addEventListener('click', resetGame);

    resetGame();
  </script>
</body>
</html>
